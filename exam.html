<!DOCTYPE html>
<html lang="ko" class="on-rounds">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모의고사</title>

  <!-- 휴대폰 바탕화면에 앱처럼 놓기 위한 설정 -->
  <link rel="manifest" href="exam-manifest.json?v=20260917a">
  <meta name="theme-color" content="#5b2d8e">
  <link rel="icon" href="exam-favicon.png?v=20260917a">
  <link rel="apple-touch-icon" href="exam-apple-touch-icon.png?v=20260917a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="보라! 모의고사">

  <link rel="stylesheet" href="style.css?v=20260917a">
</head>
<body>

  <main class="app">

    <!-- 1. 학생 정보 입력 화면 -->
    <section id="screen-start" class="screen">
      <div class="brand-box">
        <img class="brand-mark" src="logo/mark-white.png?v=20260917a" alt="" width="450" height="397">
        <h1 class="brand-name">보라! 모의고사</h1>
      </div>

      <form id="start-form" class="card" autocomplete="off">
        <div class="field">
          <label class="label" for="student-name">학생 이름</label>
          <input type="text" id="student-name" class="input" placeholder="예) 김민서" maxlength="20">
        </div>

        <div class="field">
          <label class="label" for="student-school">학교</label>
          <input type="text" id="student-school" class="input" placeholder="예) 보라고등학교" maxlength="30">
        </div>

        <div class="field">
          <label class="label" for="student-phone4">학부모님 전화번호 뒷 4자리</label>
          <input type="text" id="student-phone4" class="input" placeholder="예) 1234"
                 inputmode="numeric" maxlength="4">
          <p class="field-hint">같은 이름이 있을 때 학생을 구분하는 데만 씁니다.</p>
        </div>

        <p id="name-error" class="error" hidden></p>
        <button type="submit" id="btn-start" class="btn btn-primary">다음</button>
        <button type="button" id="btn-my-history" class="btn btn-quiet" hidden>내 지난 기록 보기</button>
      </form>
    </section>

    <!-- 2. 회차 고르기 화면 -->
    <section id="screen-rounds" class="screen" hidden>
      <div class="brand-box">
        <img class="brand-mark" src="logo/mark-white.png?v=20260917a" alt="" width="450" height="397">
        <p class="brand-name">보라! 모의고사</p>
      </div>

      <div id="round-list" class="round-list"></div>
      <p id="rounds-empty" class="rounds-empty" hidden></p>

      <button type="button" id="btn-back-start" class="btn btn-quiet btn-on-deep">이름 다시 입력</button>
    </section>

    <!-- 3. 선택과목 고르기 화면 -->
    <section id="screen-subject" class="screen" hidden>
      <button type="button" id="btn-back-rounds" class="btn-back">회차 다시 고르기</button>

      <div class="card">
        <p class="eyebrow">선택과목</p>
        <p id="subject-round" class="chosen-round"></p>
        <p class="chosen-detail">시험에서 푼 선택과목을 고르세요. 35~45번이 이 과목의 정답표로 채점됩니다.</p>
      </div>

      <div id="subject-list" class="subject-list"></div>
    </section>

    <!-- 4. 답 입력 화면 (OMR) -->
    <section id="screen-sheet" class="screen" hidden>
      <header class="quiz-head">
        <p id="sheet-round" class="quiz-round"></p>
        <div class="progress-text">
          <span id="sheet-done">0</span> / <span id="sheet-total">45</span> 입력
        </div>
        <div class="progress-bar"><div id="sheet-fill" class="progress-fill"></div></div>
      </header>

      <p class="sheet-guide">답안지에 칠한 번호를 그대로 눌러 주세요. 잘못 눌렀으면 다시 누르면 지워집니다.</p>

      <div id="sheet-list" class="sheet-list"></div>

      <p id="sheet-left" class="sheet-left"></p>
      <p id="sheet-error" class="error" hidden></p>
      <button id="btn-submit" class="btn btn-primary">채점하기</button>
      <button type="button" id="btn-back-subject" class="btn btn-quiet">선택과목 다시 고르기</button>
    </section>

    <!-- 5. 결과 화면 -->
    <section id="screen-result" class="screen" hidden>
      <div class="card result-card">
        <p id="result-round" class="result-round"></p>
        <p id="result-name" class="result-name"></p>
        <p class="result-score">
          <span id="result-score">0</span><span class="result-total">점</span>
        </p>
        <p id="result-grade" class="result-percent"></p>
        <p id="result-comment" class="result-comment"></p>
      </div>

      <section>
        <h2 class="section-title">영역별 성취도</h2>
        <div id="area-list" class="area-list"></div>
      </section>

      <section id="wrong-area">
        <h2 class="section-title">틀린 문항과 못 푼 문항</h2>
        <p id="wrong-count" class="wrong-count"></p>
        <div id="wrong-list" class="wrong-list"></div>
      </section>

      <p id="save-state" class="save-state" hidden></p>

      <button id="btn-history" class="btn btn-quiet">내 기록 보기</button>
      <button id="btn-home" class="btn btn-quiet">처음으로 돌아가기</button>
    </section>

    <!-- 6. 내 기록 화면 -->
    <section id="screen-history" class="screen" hidden>
      <button type="button" id="btn-back-from-history" class="btn-back">돌아가기</button>

      <div class="card">
        <p class="eyebrow">지금까지의 기록</p>
        <p id="history-who" class="chosen-round"></p>
        <p id="history-summary" class="chosen-detail"></p>
      </div>

      <div id="history-list" class="history-list"></div>
    </section>

    <!-- 오류 안내 (회차 파일에 실수가 있을 때만 보입니다) -->
    <section id="screen-error" class="screen" hidden>
      <div class="card">
        <h2 class="section-title">회차 파일을 확인해주세요</h2>
        <p class="hint">exams.js 파일에서 아래 부분을 고쳐주세요.</p>
        <ul id="error-list" class="error-list"></ul>
      </div>
    </section>

  </main>

  <script>var APP_SUBJECT = "모의고사";</script>
  <script src="exams.js?v=20260917a"></script>
  <script src="storage.js?v=20260917a"></script>
  <script src="exam.js?v=20260917a"></script>
</body>
</html>
