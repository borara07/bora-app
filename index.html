<!DOCTYPE html>
<html lang="ko" class="on-rounds">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보라! 국어</title>

  <!-- 휴대폰 바탕화면에 앱처럼 놓기 위한 설정 (이 아이콘 하나로 네 과목이 다 열립니다) -->
  <link rel="manifest" href="manifest.json?v=20261018j">
  <meta name="theme-color" content="#5b2d8e">
  <link rel="icon" href="favicon.png?v=20261018j">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261018j">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="보라! 국어">

  <link rel="stylesheet" href="style.css?v=20261030a">
</head>
<body>

  <main class="app">

    <!-- 1. 학생 정보 입력 화면 (진한 보라) — 재원생 확인은 여기서 한 번만 합니다 -->
    <section id="screen-start" class="screen">
      <div class="brand-box">
        <img class="brand-mark" src="logo/mark-white.png?v=20261018j" alt="" width="450" height="397">
        <h1 class="brand-name">보라! 국어</h1>
      </div>

      <form id="start-form" class="card" autocomplete="off">
        <div class="field">
          <label class="label" for="student-name">학생 이름</label>
          <input type="text" id="student-name" class="input" placeholder="예) 김민서" maxlength="20">
        </div>

        <div class="field">
          <label class="label" for="student-school">학교</label>
          <input type="text" id="student-school" class="input" placeholder="예) 보라고등학교" maxlength="30">
        </div>

        <div class="field">
          <label class="label" for="student-phone4">학부모님 전화번호 뒷 4자리</label>
          <input type="text" id="student-phone4" class="input" placeholder="예) 1234"
                 inputmode="numeric" maxlength="4">
          <p class="field-hint">같은 이름이 있을 때 학생을 구분하는 데만 씁니다.</p>
        </div>

        <p id="name-error" class="error" hidden></p>
        <button type="submit" id="btn-start" class="btn btn-primary">다음</button>
        <button type="button" id="btn-my-history" class="btn btn-quiet" hidden>내 지난 기록 보기</button>
      </form>
    </section>

    <!-- 2. 과목 고르기 화면 (연보라) -->
    <section id="screen-subjects" class="screen hub-subjects" hidden>
      <div class="brand-box">
        <picture>
          <source srcset="logo/mark-white.png?v=20261018j" media="(prefers-color-scheme: dark)">
          <img class="brand-mark" src="logo/mark.png?v=20261018j" alt="" width="450" height="397">
        </picture>
        <p class="brand-name">보라! 국어</p>
        <p id="hub-quote" class="hub-quote">“나는 점점 더 나아지고 있다.”</p>
      </div>

      <div class="hub-panel">
        <p class="hub-who"><b id="hub-name"></b> 학생<span id="hub-grade"></span></p>
        <p class="hub-pick">과목을 고르세요</p>

        <!-- 단추를 누르면 그 과목 화면으로 갑니다. 이름은 다시 묻지 않습니다 -->
        <nav class="hub-subject-list" aria-label="과목">
          <a class="hub-subject" href="vocab.html">
            <span class="hub-subject-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5c2.5-1.2 5.5-1.2 8.5.6 3-1.8 6-1.8 8.5-.6v13c-2.5-1.2-5.5-1.2-8.5.6-3-1.8-6-1.8-8.5-.6z"/><path d="M12 6.1v13.1"/></svg>
            </span>
            <span class="hub-subject-name">어휘</span>
          </a>
          <a class="hub-subject" href="grammar.html">
            <span class="hub-subject-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13 7l4 4"/></svg>
            </span>
            <span class="hub-subject-name">문법</span>
          </a>
          <a class="hub-subject" href="exam.html">
            <span class="hub-subject-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 3.5h6v3H9z"/><path d="M8.5 12l2.2 2.2 4.6-4.6"/><path d="M8.5 17.5h7"/></svg>
            </span>
            <span class="hub-subject-name">모의고사</span>
          </a>
          <a class="hub-subject" href="reading.html">
            <span class="hub-subject-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 10h9M4 14h5"/><circle cx="15.5" cy="15.5" r="3.5"/><path d="M18 18l2.5 2.5"/></svg>
            </span>
            <span class="hub-subject-name">독해</span>
          </a>
        </nav>
      </div>

      <button type="button" id="btn-rename" class="btn btn-quiet">이름 다시 입력</button>
    </section>

    <!-- 3. 내 기록 화면 (네 과목 기록을 모두 보여 줍니다) -->
    <section id="screen-history" class="screen" hidden>
      <button type="button" id="btn-back-from-history" class="btn-back">돌아가기</button>

      <div class="card">
        <p class="eyebrow">지금까지의 기록</p>
        <p id="history-who" class="chosen-round"></p>
        <p id="history-summary" class="chosen-detail"></p>
      </div>

      <div id="history-list" class="history-list"></div>
    </section>

  </main>

  <script src="storage.js?v=20261021a"></script>
  <script src="hub.js?v=20261018j"></script>
</body>
</html>
