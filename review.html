<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보라! 문제 검토</title>
  <link rel="icon" href="teacher-favicon.png?v=20260908g">
  <link rel="apple-touch-icon" href="teacher-apple-touch-icon.png?v=20260908g">
  <meta name="theme-color" content="#582b8d">
  <meta name="apple-mobile-web-app-title" content="보라! 문제 검토">
  <link rel="stylesheet" href="style.css?v=20260908g">
</head>
<body>

  <main class="app">

    <!-- 1. 비밀번호 화면 -->
    <section id="screen-login" class="screen">
      <div class="brand-box">
        <picture>
          <source srcset="logo/mark-white.png?v=20260908g" media="(prefers-color-scheme: dark)">
          <img class="brand-mark" src="logo/mark.png?v=20260908g" alt="" width="450" height="397">
        </picture>
        <p class="brand-name">보라! 문제 검토</p>
      </div>
      <p class="subtitle">학생에게 내기 전에 문제와 정답을 확인합니다.</p>

      <form id="login-form" class="card" autocomplete="off">
        <div class="field">
          <label class="label" for="password">비밀번호</label>
          <input type="password" id="password" class="input" autocomplete="off">
        </div>
        <p id="login-error" class="error" hidden></p>
        <button type="submit" class="btn btn-primary">들어가기</button>
      </form>

      <p class="hint"><a href="teacher.html">← 선생님 화면으로</a></p>
    </section>

    <!-- 2. 검토 화면 -->
    <section id="screen-review" class="screen" hidden>
      <div class="corner">
        <button type="button" id="btn-logout" class="btn-corner">나가기</button>
      </div>

      <div class="brand-box">
        <picture>
          <source srcset="logo/mark-white.png?v=20260908g" media="(prefers-color-scheme: dark)">
          <img class="brand-mark" src="logo/mark.png?v=20260908g" alt="" width="450" height="397">
        </picture>
        <p class="brand-name">보라! 문제 검토</p>
      </div>

      <div class="card no-print">
        <div class="field">
          <label class="label" for="pick-subject">과목</label>
          <select id="pick-subject" class="input">
            <option value="문법">문법</option>
            <option value="어휘">어휘</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="pick-round">회차</label>
          <select id="pick-round" class="input"></select>
        </div>
        <p class="field-hint">아래 목록에 그 회차의 <b>모든 문제와 정답·해설</b>이 나옵니다.
          다 보시고 이상이 없으면 선생님 화면에서 이번 주 시험으로 정해 주세요.</p>
      </div>

      <h2 class="section-title" id="round-title">회차</h2>
      <p id="round-sub" class="field-hint"></p>

      <div class="card">
        <p class="eyebrow">한눈에 보기</p>
        <div id="summary" class="summary-row"></div>
        <ul id="notes" class="review-notes"></ul>
      </div>

      <div id="question-list"></div>

      <button type="button" id="btn-print" class="btn btn-quiet no-print">인쇄하기 (또는 PDF로 저장)</button>

      <p class="hint no-print">
        <a href="teacher.html">선생님 화면</a> · <a href="./">학생 화면 보기</a>
      </p>
    </section>

  </main>

  <script src="questions.js?v=20260908g"></script>
  <script src="questions-grammar.js?v=20260908g"></script>
  <script src="storage.js?v=20260908g"></script>
  <script src="review.js?v=20260908g"></script>
</body>
</html>
