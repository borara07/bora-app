<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서버 연결 확인</title>
  <link rel="icon" href="favicon.png?v=20260903q">
  <meta name="theme-color" content="#7c3aed">
  <link rel="stylesheet" href="style.css?v=20260903q">
</head>
<body>

  <main class="app">
    <h1>서버 연결 확인</h1>
    <p class="subtitle">이 화면을 사진 찍어 보내주세요.</p>

    <div class="card">
      <p class="eyebrow">확인 결과</p>
      <p id="verdict" class="chosen-round">확인하는 중…</p>
      <p id="reason" class="check-state" hidden></p>
    </div>

    <div class="card">
      <p class="eyebrow">현재 설정</p>
      <ul id="config" class="config-list"></ul>
    </div>

    <div class="card">
      <p class="eyebrow">이 기기에 남아 있는 기록</p>
      <p id="pending" class="chosen-round">세는 중…</p>
      <p id="pending-detail" class="chosen-detail">아직 서버로 못 보낸 기록이 있으면 여기서 보낼 수 있습니다.</p>
      <button type="button" id="btn-resend" class="btn btn-primary">지금 보내기</button>
      <p id="resend-state" class="check-state" hidden></p>
    </div>

    <button type="button" id="btn-again" class="btn btn-quiet">다시 확인하기</button>
    <p class="hint"><a href="./">← 테스트 화면으로 돌아가기</a></p>
  </main>

  <script src="storage.js?v=20260903q"></script>
  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };

    /* 키는 앞뒤 일부만 보여 줍니다 */
    function mask(key) {
      if (!key) return '(비어 있음)';
      if (key.length < 16) return key;
      return key.slice(0, 12) + '…' + key.slice(-4) + ' (' + key.length + '자)';
    }

    function showConfig() {
      var rows = [
        ['프로젝트 주소', SUPABASE.url || '(비어 있음)'],
        ['표 이름', SUPABASE.table || '(비어 있음)'],
        ['키', mask(SUPABASE.anonKey)],
        ['앱 버전', '2026-08-30 재원생만 시험 시작 가능']
      ];
      var ul = $('config');
      ul.innerHTML = '';
      rows.forEach(function (r) {
        var li = document.createElement('li');
        var b = document.createElement('strong');
        b.textContent = r[0] + ' : ';
        li.appendChild(b);
        li.appendChild(document.createTextNode(r[1]));
        ul.appendChild(li);
      });
    }

    /* 1단계: 그 주소에 서버가 있기는 한지 확인합니다.
       (주소가 틀리면 여기서 바로 걸립니다) */
    function probeHost() {
      if (!SUPABASE.url) return Promise.resolve(false);
      return fetch(SUPABASE.url.replace(/\/+$/, '') + '/rest/v1/', { mode: 'no-cors' })
        .then(function () { return true; })
        .catch(function () { return false; });
    }

    function run() {
      var verdict = $('verdict');
      var reason = $('reason');

      verdict.textContent = '확인하는 중…';
      reason.hidden = true;

      probeHost().then(function (alive) {
        if (!alive) {
          verdict.textContent = '주소가 잘못되었습니다';
          verdict.style.color = 'var(--wrong)';
          reason.hidden = false;
          reason.className = 'check-state is-bad';
          reason.textContent =
            '이 주소에서 수파베이스 서버를 찾을 수 없습니다.\n' +
            SUPABASE.url + '\n\n' +
            '수파베이스 API 화면의 Project URL 을 그대로 복사해서 알려주세요.';
          return;
        }
        checkSaving();
      });
    }

    function checkSaving() {
      var verdict = $('verdict');
      var reason = $('reason');

      VocabStore.testConnection().then(function (r) {
        verdict.textContent = r.ok ? '연결 성공' : '연결 실패';
        verdict.style.color = r.ok ? 'var(--correct)' : 'var(--wrong)';

        reason.hidden = false;
        reason.className = 'check-state ' + (r.ok ? 'is-ok' : 'is-bad');
        reason.textContent = r.message;

        if (!r.ok) {
          reason.textContent = '서버는 찾았는데 준비가 덜 되었습니다.\n\n' + r.message;
        }

        if (r.detail) {
          var more = document.createElement('span');
          more.className = 'check-detail';
          more.textContent = r.detail;
          reason.appendChild(more);
        }
      });
    }

    function showPending() {
      var waiting = VocabStore.all().filter(function (r) { return !r.sent; });
      $('pending').textContent = waiting.length + '건';
      $('btn-resend').disabled = waiting.length === 0;
      $('pending-detail').textContent = waiting.length === 0
        ? '못 보낸 기록이 없습니다.'
        : '아직 서버로 못 보낸 기록이 ' + waiting.length + '건 있습니다.';
      return waiting.length;
    }

    function resendAll() {
      var box = $('resend-state');
      box.hidden = false;
      box.className = 'check-state';
      box.textContent = '보내는 중…';

      VocabStore.resend().then(function (count) {
        var left = showPending();
        if (count > 0 && left === 0) {
          box.className = 'check-state is-ok';
          box.textContent = count + '건을 모두 보냈습니다.\n수파베이스 Table Editor 를 새로고침해보세요.';
        } else if (count > 0) {
          box.className = 'check-state';
          box.textContent = count + '건을 보냈고, ' + left + '건이 남았습니다.';
        } else {
          box.className = 'check-state is-bad';
          box.textContent = '보내지 못했습니다.\n위쪽 확인 결과를 먼저 봐주세요.';
        }
      });
    }

    showConfig();
    showPending();
    $('btn-again').addEventListener('click', run);
    $('btn-resend').addEventListener('click', resendAll);
    run();
  })();
  </script>
</body>
</html>
