<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보라! 선생님</title>
  <!-- 선생님용은 아이콘과 설치 설정을 따로 씁니다 (학생용과 헷갈리지 않게) -->
  <link rel="manifest" href="teacher-manifest.json?v=20260903t">
  <link rel="icon" href="teacher-favicon.png?v=20260903t">
  <link rel="apple-touch-icon" href="teacher-apple-touch-icon.png?v=20260903t">
  <meta name="theme-color" content="#582b8d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="보라! 선생님">
  <link rel="stylesheet" href="style.css?v=20260903t">
</head>
<body>

  <main class="app">

    <!-- 1. 비밀번호 화면 -->
    <section id="screen-login" class="screen">
      <div class="brand-box">
        <picture>
          <source srcset="logo/mark-white.png?v=20260903t" media="(prefers-color-scheme: dark)">
          <img class="brand-mark" src="logo/mark.png?v=20260903t" alt="" width="450" height="397">
        </picture>
        <p class="brand-name">보라! 선생님</p>
      </div>
      <p class="subtitle">학생들의 시험 결과를 봅니다.</p>

      <form id="login-form" class="card" autocomplete="off">
        <div class="field">
          <label class="label" for="password">비밀번호</label>
          <input type="password" id="password" class="input" autocomplete="off">
        </div>
        <p id="login-error" class="error" hidden></p>
        <button type="submit" class="btn btn-primary">들어가기</button>
      </form>

      <p class="hint"><a href="./">← 학생 화면으로</a></p>
    </section>

    <!-- 2. 결과 화면 -->
    <section id="screen-board" class="screen" hidden>
      <div class="corner">
        <button type="button" id="btn-logout" class="btn-corner">나가기</button>
      </div>

      <div class="brand-box">
        <picture>
          <source srcset="logo/mark-white.png?v=20260903t" media="(prefers-color-scheme: dark)">
          <img class="brand-mark" src="logo/mark.png?v=20260903t" alt="" width="450" height="397">
        </picture>
        <p class="brand-name">보라! 선생님</p>
        <p id="who-note" class="who-note" hidden></p>
      </div>
      <p id="source-note" class="save-state"></p>

      <div class="card" id="admin-homework">
        <div class="field">
          <label class="label" for="homework-subject">과목</label>
          <select id="homework-subject" class="input">
            <option value="어휘">어휘</option>
            <option value="문법">문법</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="homework-group" id="homework-group-label">반</label>
          <select id="homework-group" class="input">
            <option value="고등부">고등부</option>
            <option value="중등부">중등부</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="homework-pick">이번 주 시험</label>
          <select id="homework-pick" class="input"></select>
        </div>

        <button type="button" id="btn-homework" class="btn btn-primary">이 회차로 정하기</button>
        <p id="homework-state" class="check-state" hidden></p>
      </div>

      <div class="card">
        <p class="eyebrow">통계에서 볼 반</p>
        <select id="stat-group" class="input">
          <option value="">전체</option>
          <option value="고등부">고등부</option>
          <option value="중등부">중등부</option>
        </select>
      </div>

      <div class="card">
        <p class="eyebrow">전체 요약</p>
        <div id="summary" class="summary-row"></div>
      </div>

      <section id="roster-area" hidden>
        <h2 class="section-title">재원생 응시 현황</h2>
        <p id="roster-note" class="field-hint"></p>

        <div class="table-wrap" id="grade-wrap">
          <table class="data-table" id="table-grade">
            <thead>
              <tr>
                <th data-sort="grade">학년</th>
                <th data-sort="count" class="num">인원</th>
                <th data-sort="taken" class="num">응시</th>
                <th data-sort="notYet" class="num">아직</th>
                <th data-sort="avg" class="num">평균</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="roster-group" id="roster-box-high" hidden>
          <p class="roster-group-title" id="roster-head-high">고등부</p>
          <div class="table-wrap">
            <table class="data-table" id="table-roster-high">
              <thead>
                <tr>
                  <th data-sort="name">이름</th>
                  <th data-sort="school">학교</th>
                  <th data-sort="count" class="num">응시</th>
                  <th data-sort="avg" class="num">평균</th>
                  <th data-sort="last">최근</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="roster-group" id="roster-box-mid" hidden>
          <p class="roster-group-title" id="roster-head-mid">중등부</p>
          <div class="table-wrap">
            <table class="data-table" id="table-roster-mid">
              <thead>
                <tr>
                  <th data-sort="name">이름</th>
                  <th data-sort="school">학교</th>
                  <th data-sort="count" class="num">응시</th>
                  <th data-sort="avg" class="num">평균</th>
                  <th data-sort="last">최근</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <h2 class="section-title">회차별 평균</h2>
      <div class="table-wrap">
        <table class="data-table" id="table-rounds">
          <thead>
            <tr>
              <th data-sort="title">회차</th>
              <th data-sort="students" class="num">인원</th>
              <th data-sort="count" class="num">응시</th>
              <th data-sort="avg" class="num">평균</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <h2 class="section-title">학생별 누적</h2>
      <div class="table-wrap">
        <table class="data-table" id="table-students">
          <thead>
            <tr>
              <th data-sort="name">이름</th>
              <th data-sort="school">학교</th>
              <th data-sort="count" class="num">응시</th>
              <th data-sort="avg" class="num">평균</th>
              <th data-sort="last">최근</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <h2 class="section-title">전체 기록</h2>
      <div class="table-wrap">
        <table class="data-table" id="table-all">
          <thead>
            <tr>
              <th data-sort="name">이름</th>
              <th data-sort="school">학교</th>
              <th data-sort="roundTitle">회차</th>
              <th data-sort="percent" class="num">점수</th>
              <th data-sort="savedAt">날짜</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="admin-tools">
        <button type="button" id="btn-export" class="btn btn-primary">엑셀(CSV)로 내려받기</button>
        <p id="export-state" class="field-hint" hidden></p>

        <h2 class="section-title">문제 은행</h2>
        <p id="bank-note" class="field-hint"></p>
        <button type="button" id="btn-upload" class="btn btn-quiet">문제 은행에 올리기</button>
        <p id="upload-state" class="check-state" hidden></p>
      </div>

      <p class="hint">
        <a href="./">학생 화면 보기</a> · <a href="check.html">서버 연결 확인</a>
      </p>
    </section>

  </main>

  <script src="questions.js?v=20260903t"></script>
  <script src="questions-grammar.js?v=20260903t"></script>
  <script src="storage.js?v=20260903t"></script>
  <script src="teacher.js?v=20260903t"></script>
</body>
</html>
